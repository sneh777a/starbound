<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sneha Ghosh | Star Bound</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<!-- Background Video -->
<div class="video-background">
  <video autoplay muted loop playsinline id="bg-video">
    <source src="assets/video/starry-night.mp4" type="video/mp4">
  </video>
</div>

<!-- Fallback stars (shows if video fails) -->
<div class="stars"></div>
<div class="twinkling"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">🌟 Star Bound</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <div class="hamburger">☰</div>
  </nav>

  <!-- Hero Section -->
  <header id="home" class="hero">
    <div class="hero-content">
      <img src="assets/image/profile.jpg" alt="Sneha Ghosh" class="profile-img" />
      
      <h1>Hi, I'm <span class="highlight">Sneha Ghosh</span></h1>
      <h2 id="typewriter"></h2>
      
      <p class="tagline">
        Final-year CS student building full-stack apps with AI & Cloud.<br>
        Open to internships and new-grad roles.
      </p>

      <div class="hero-buttons">
        <a href="assets/resume/resume.pdf" class="btn" target="_blank">Download Resume</a>
        <a href="#projects" class="btn btn-outline">View Projects</a>
      </div>

      <div class="social-links">
        <a href="https://github.com/sneh777a" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/sneh777a" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:snehaghosh.official@gmail.com"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </header>

  <!-- Temporary empty sections so page has height -->
  <section id="about" style="height: 100vh;"></section>
  <section id="projects" style="height: 100vh;"></section>
  <section id="skills" style="height: 100vh;"></section>
  <section id="contact" style="height: 100vh;"></section>

  <script src="script.js"></script>
</body>
</html>
